name: Convert HEIC Images

on:
  push:
    branches:
      - main
    paths:
      - '**/*.heic'
      - '**/*.HEIC'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install conversion dependencies
        run: python -m pip install --upgrade pip pillow pillow-heif

      - name: Convert HEIC files to JPEG and remove originals
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import traceback
          from PIL import Image
          import pillow_heif

          pillow_heif.register_heif_opener()

          converted = []
          failed = []
          try:
              tracked_files = subprocess.check_output(['git', 'ls-files', '--', '*.heic', '*.HEIC'], text=True).splitlines()
          except subprocess.CalledProcessError as exc:
              raise RuntimeError(f'Failed to list tracked HEIC files via git: {exc}') from exc

          for relpath in tracked_files:
              source = Path(relpath)
              if not source.is_file():
                  continue
              target = source.with_suffix('.jpg')
              try:
                  with Image.open(source) as img:
                      img.convert('RGB').save(target, format='JPEG', quality=90, optimize=True)
                  if not target.exists() or target.stat().st_size == 0:
                      raise RuntimeError(f'JPEG output missing or empty: {target}')
                  with Image.open(target) as converted_img:
                      converted_img.load()
                  try:
                      source.unlink()
                  except Exception as delete_exc:
                      target.unlink(missing_ok=True)
                      raise RuntimeError(
                          f'Failed to delete original HEIC file {source}; '
                          f'rolling back by removing converted JPEG. '
                          f'{type(delete_exc).__name__}: {delete_exc}'
                      ) from delete_exc
                  converted.append((str(source), str(target)))
              except Exception as exc:
                  print(f'Failed to convert {source}: {exc}')
                  failed.append((str(source), f'{type(exc).__name__}: {exc}', traceback.format_exc()))

          if not converted:
              print('No HEIC files found to convert.')
          else:
              print('Converted HEIC files:')
              for src, dst in converted:
                  print(f'- {src} -> {dst}')

          if failed:
              print('HEIC files that failed conversion:')
              for path, err, trace in failed:
                  print(f'- {path}: {err}')
                  print(trace)
              raise SystemExit(1)
          PY

      - name: Commit converted JPEG files
        run: |
          git add -u -- '*.heic' '*.HEIC' '*.jpg' '*.JPG'
          git add -- '*.jpg' '*.JPG'
          if git diff --cached --quiet; then
            echo "No converted files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-convert uploaded HEIC images to JPEG and remove originals"
          git push
